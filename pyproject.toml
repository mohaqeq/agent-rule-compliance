[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rule-compliance"
version = "0.1.0"
description = "Experiments on when AI coding agents break project rules, and what prevents it. Harness, tasks, graders and results."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ucn @ git+https://github.com/mohaqeq/unified-context-notation@phase1-and-study-a",
]

[tool.setuptools]
py-modules = []
